name: Next.js MongoDB Deploy

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-south-1
      ECR_REGISTRY: 360131674968.dkr.ecr.ap-south-1.amazonaws.com
      IMAGE_NAME: nextjs-mongodb-app

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      # -------------------------
      # AWS
      # -------------------------

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_DEV }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_DEV }}
          aws-region: ${{ env.AWS_REGION }}


      # -------------------------
      # ECR LOGIN
      # -------------------------

      - name: Login to ECR
        run: |
          aws ecr get-login-password \
            --region "$AWS_REGION" \
          | docker login \
            --username AWS \
            --password-stdin "$ECR_REGISTRY"


      # -------------------------
      # VERSION
      # -------------------------

      - name: Set image version
        run: |
          echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"


      # -------------------------
      # BUILD
      # -------------------------

      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$IMAGE_NAME:$VERSION" \
            .


      # -------------------------
      # PUSH
      # -------------------------

      - name: Push Docker image
        run: |
          docker push \
            "$ECR_REGISTRY/$IMAGE_NAME:$VERSION"


      # -------------------------
      # SSH
      # -------------------------

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_FRONTEND_DEV }}


      # -------------------------
      # DEPLOY
      # -------------------------

      - name: Deploy to EC2
        env:
          SSH_HOST: ${{ secrets.SSH_HOST_FRONTEND_DEV }}
          SSH_USER: ${{ secrets.SSH_USER_FRONTEND_DEV }}

          MONGO_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
          MONGO_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}

        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "sudo mkdir -p /var/lib/projects/nextjs-mongodb-app && sudo chown -R \$USER:\$USER /var/lib/projects/nextjs-mongodb-app"


          ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "aws ecr get-login-password --region $AWS_REGION | sudo docker login --username AWS --password-stdin $ECR_REGISTRY"


          ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "cd /var/lib/projects/nextjs-mongodb-app && \
             echo 'ECR_IMAGE=$ECR_REGISTRY/$IMAGE_NAME:$VERSION' > .env && \
             echo 'MONGO_ROOT_USERNAME=$MONGO_USERNAME' >> .env && \
             echo 'MONGO_ROOT_PASSWORD=$MONGO_PASSWORD' >> .env && \
             echo 'MONGODB_URI=mongodb://$MONGO_USERNAME:$MONGO_PASSWORD@mongodb:27017/employee_db?authSource=admin' >> .env"


          scp \
            -o StrictHostKeyChecking=no \
            docker-compose.yml \
            "$SSH_USER@$SSH_HOST:/var/lib/projects/nextjs-mongodb-app/docker-compose.yml"


          ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "cd /var/lib/projects/nextjs-mongodb-app && \
             sudo docker compose pull nextjs && \
             sudo docker compose up -d && \
             sudo docker image prune -af"


      # -------------------------
      # VERIFY
      # -------------------------

      - name: Verify deployment
        env:
          SSH_HOST: ${{ secrets.SSH_HOST_FRONTEND_DEV }}
          SSH_USER: ${{ secrets.SSH_USER_FRONTEND_DEV }}

        run: |

          ssh \
            -o StrictHostKeyChecking=no \
            "$SSH_USER@$SSH_HOST" \
            "sudo docker compose -f /var/lib/projects/nextjs-mongodb-app/docker-compose.yml ps"